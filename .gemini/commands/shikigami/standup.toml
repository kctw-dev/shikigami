description = "執行每日站立會議，檢視當前 Sprint 進度與阻礙"

prompt = """
## 模式選擇

| 模式 | 觸發方式 | 執行範圍 |
|------|---------|---------|
| 快思（預設） | 直接執行 `/shikigami:standup` | 區塊一（Git 同步） + 區塊三（Sprint 進度） |
| 慢想 | `/shikigami:standup --deep` 或說「完整檢查」 | 全部四個區塊（區塊零~三） |

執行 Daily Standup，依序完成以下四個區塊：

## 區塊零：健康快篩

> **慢想模式限定**：此區塊僅在慢想模式下執行。快思模式跳過此區塊。

在進入 Standup 主體前，執行輕量健康掃描（2 項）：

**檢查 1：必要文件存在性**

**前置判斷（框架 Repo 偵測）**：

若 `./gemini-extension.json` 存在且非空，或 `./.claude-plugin/plugin.json` 存在且非空，代表當前處於框架開發 Repo（非消費端專案）。此時 `GEMINI.md`/`CLAUDE.md` 為非必要文件：
- 跳過專案配置文件存在性檢查
- 將檢查結果標記為 PASS
- 輸出附加說明：「（框架 Repo，專案配置文件檢查略過）」
- 繼續檢查其餘 2 個核心文件（PROJECT_BOARD.md、PRODUCT_BACKLOG.md）

若上述檔案都不存在，依原有邏輯執行全部 3 個核心文件檢查，行為不變。

掃描以下 3 個核心文件是否存在且非空（若已觸發框架 Repo 前置判斷，專案配置文件行略過）：
- `./GEMINI.md`（Gemini CLI 專案）或 `./CLAUDE.md`（Claude Code 專案）
- `docs/PROJECT_BOARD.md`
- `docs/prd/PRODUCT_BACKLOG.md`

判定規則：任一文件不存在或為空（0 bytes）→ FAIL；全部存在且有內容 → PASS。框架 Repo 情境下，專案配置文件不存在視為 PASS，不計入 FAIL 條件。

**檢查 4：Retro Action Items 逾期偵測**

讀取 `docs/km/Retrospective_Log.md`，找出所有狀態為 `Open` 的 Action Items。日期基準從所屬 Sprint 區塊標題提取（格式：`## Sprint N — YYYY-MM-DD`）。

判定規則：無 Open 項目或 Open 項目距今 ≤ 14 天 → PASS；有 Open 項目距今 > 14 天 → OVERDUE。

**快篩 Overall 判定規則**：

| 條件 | 快篩狀態 |
|------|----------|
| 任一項 FAIL | CRITICAL |
| 有 OVERDUE 但無 FAIL | WARNING |
| 全部 PASS | HEALTHY |

**輸出格式**（置於報告頂端）：

- HEALTHY：`**健康快篩**：HEALTHY`
- WARNING：`**健康快篩**：WARNING — Retro Action #N 已逾期 {天數} 天`
- CRITICAL：`**健康快篩**：CRITICAL — {缺失文件} 缺失，建議執行 /shikigami:sprint`

WARNING/CRITICAL 僅附提示，不阻塞後續 Standup 流程，繼續執行區塊一與區塊二。

## 區塊一：Git 同步狀態

先檢查本地與遠端的同步狀態：

1. 執行 `git remote` 檢查是否有遠端設定
   - 若輸出為空 → 顯示「**Git 同步**：無遠端設定，略過同步檢查」，跳到區塊二
2. 執行 `git fetch --quiet`（超時 5 秒）
   - 若失敗（離線/超時/錯誤）→ 顯示「**Git 同步**：無法連線遠端，同步狀態未知」，跳到區塊二
3. 檢查當前 branch 是否有 tracking branch（`git rev-parse --abbrev-ref @{u}` 是否成功）
   - 若無 tracking branch → 顯示「**Git 同步**：本地分支尚未設定遠端追蹤」，跳到區塊二
4. 計算差距：
   - 未推送：`git rev-list --count @{u}..HEAD`
   - 未拉取：`git rev-list --count HEAD..@{u}`
5. 顯示結果：
   - **Git 同步**：本地已同步（兩者皆為 0）
   - **Git 同步**：本地有 N 個未推送的 commits（未推送 > 0）
   - **Git 同步**：遠端有 N 個未拉取的 commits，建議執行 `git pull`（未拉取 > 0）
   - 兩者皆 > 0 時兩條都顯示

## 區塊二：GitHub Issues 掃描

> **慢想模式限定**：此區塊僅在慢想模式下執行。快思模式跳過此區塊。

檢查是否有需要關注的 open issues：

> **掃描範圍**：僅掃描本 repo 的 open issues（不含 Pull Requests）。目的是在每日 Standup 中揭露新進 issues，避免 Sprint Planning（每週一次）之間的盲區。

1. 執行 `gh issue list --state open --limit 20`（超時 5 秒）
   - 若失敗（gh 未安裝/未認證/離線）→ 顯示「**Issues 掃描**：無法連線 GitHub，略過 Issues 掃描」，跳到區塊三
2. 計算 open issues 數量
3. 顯示結果：
   - **Issues 掃描**：目前無 open issues（數量為 0）
   - **Issues 掃描**：目前有 N 個 open issues（數量 > 0 時，列出最多 5 個摘要：編號 + 標題 + label）

## 區塊三：Sprint 進度

讀取 `docs/PROJECT_BOARD.md` 的內容，產出 Sprint 進度摘要：

格式：
- **昨天完成**：[從 PROJECT_BOARD 已完成欄位摘錄最近完成的任務]
- **今天計畫**：[從 PROJECT_BOARD 進行中欄位列出當前任務；若無進行中，從待開發欄位取最高優先]
- **阻礙**：[有/無，描述]

如果 `docs/PROJECT_BOARD.md` 不存在，提示使用者先執行 `/shikigami:sprint` 建立 Sprint。
"""
