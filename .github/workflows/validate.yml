name: Structural Validation

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Skills
        run: bash scripts/validate-skills.sh

      - name: Validate Agents
        run: bash scripts/validate-agents.sh

      - name: Validate JSON
        run: bash scripts/validate-json.sh

      - name: Validate Version
        run: bash scripts/validate-version.sh

      - name: Validate Cross References
        run: bash scripts/validate-xrefs.sh

      - name: Validate Commands
        run: bash scripts/validate-commands.sh
