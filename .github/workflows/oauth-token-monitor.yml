name: OAuth Token Expiry Monitor

# ADR-030: Claude OAuth Token Watchdog -- CI monitor
# Issue #597: retro CI New Issue Intake OAuth token fix
# Daily check for CLAUDE_CODE_OAUTH_TOKEN expiry, creates alert issue on 401

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check-token:
    name: Check OAuth Token Health
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate OAuth Token
        id: validate
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.anthropic.com/v1/models 2>/dev/null || echo "000")
          echo "http_code=${HTTP_CODE}" >> $GITHUB_OUTPUT
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "status=valid" >> $GITHUB_OUTPUT
            echo "[TOKEN-OK] OAuth token valid (HTTP ${HTTP_CODE})"
          elif [[ "${HTTP_CODE}" == "401" ]]; then
            echo "status=expired" >> $GITHUB_OUTPUT
            echo "[TOKEN-FAIL] OAuth token expired (HTTP 401)"
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "[TOKEN-WARN] Cannot verify token (HTTP ${HTTP_CODE})"
          fi

      - name: Check for existing alert (冪等防重複建立)
        if: steps.validate.outputs.status == 'expired'
        id: check-existing
        run: |
          EXISTING=$(gh issue list \
            --label "retro-action" \
            --state open \
            --search "[TOKEN-ALERT]" \
            --json number --jq length)
          echo "existing=${EXISTING}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Alert Issue
        if: >
          steps.validate.outputs.status == 'expired' &&
          steps.check-existing.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DETECTED_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "ISSUE_BODY<<ISSUE_EOF"
            echo "OAuth Token Alert - Detected: ${DETECTED_TIME}"
            echo ""
            echo "CLAUDE_CODE_OAUTH_TOKEN has expired (HTTP 401)."
            echo "Affected workflows: New Issue Intake, Sprint Dispatch"
            echo ""
            echo "Fix: run claude auth login, update CLAUDE_CODE_OAUTH_TOKEN secret."
            echo "Ref: ADR-030 OAuth Token Watchdog, Issue #597"
            echo "ISSUE_EOF"
          } >> $GITHUB_ENV
          gh issue create \
            --title "[TOKEN-ALERT] CLAUDE_CODE_OAUTH_TOKEN expired - update required" \
            --body "${ISSUE_BODY}" \
            --label "retro-action" \
            --label "priority: must"
          echo "[TOKEN-ALERT] Alert issue created"

      - name: Summary
        run: |
          echo "Token Status: ${{ steps.validate.outputs.status }}"
          echo "HTTP Code: ${{ steps.validate.outputs.http_code }}"
